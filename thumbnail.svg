<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <defs>
    <radialGradient id="bg" cx="50%" cy="-10%" r="120%">
      <stop offset="0%" stop-color="#1b2a5e"/>
      <stop offset="55%" stop-color="#0b1026"/>
      <stop offset="100%" stop-color="#070b1c"/>
    </radialGradient>
    <linearGradient id="block" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2d3a72"/>
      <stop offset="100%" stop-color="#1b2350"/>
    </linearGradient>
    <linearGradient id="brick" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff8c42"/>
      <stop offset="100%" stop-color="#d64500"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4cc9f0"/>
      <stop offset="100%" stop-color="#f72585"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- 좌측 벽돌 스택 -->
  <g>
    <rect x="40" y="500" width="120" height="42" rx="6" fill="url(#brick)" stroke="#00000055"/>
    <rect x="40" y="452" width="120" height="42" rx="6" fill="url(#brick)" stroke="#00000055"/>
    <rect x="40" y="404" width="120" height="42" rx="6" fill="url(#brick)" stroke="#00000055"/>
    <text x="100" y="529" fill="#2a0d00" font-size="20" font-weight="800" text-anchor="middle">moon</text>
    <text x="100" y="481" fill="#2a0d00" font-size="20" font-weight="800" text-anchor="middle">tree</text>
    <text x="100" y="433" fill="#2a0d00" font-size="20" font-weight="800" text-anchor="middle">star</text>
  </g>

  <!-- 떨어지는 영어 블록들 -->
  <g filter="url(#glow)">
    <g transform="translate(360,90)">
      <rect width="190" height="64" rx="14" fill="url(#block)" stroke="#4cc9f0" stroke-width="3"/>
      <text x="95" y="42" fill="#fff" font-size="30" font-weight="800" text-anchor="middle">apple</text>
    </g>
    <g transform="translate(640,180)">
      <rect width="180" height="64" rx="14" fill="url(#block)" stroke="#4cc9f0" stroke-width="3"/>
      <text x="90" y="42" fill="#fff" font-size="30" font-weight="800" text-anchor="middle">happy</text>
    </g>
    <g transform="translate(470,290)">
      <rect width="140" height="64" rx="14" fill="url(#block)" stroke="#ff4d6d" stroke-width="3"/>
      <text x="70" y="42" fill="#fff" font-size="30" font-weight="800" text-anchor="middle">run</text>
    </g>
  </g>

  <!-- 제목 -->
  <text x="600" y="430" fill="url(#title)" font-size="76" font-weight="900" text-anchor="middle">영단어 낙하 게임</text>
  <text x="600" y="478" fill="#9aa6d6" font-size="30" font-weight="700" letter-spacing="6" text-anchor="middle">ENGLISH WORD DROP</text>

  <!-- 하단 입력창 느낌 -->
  <g transform="translate(330,520)">
    <rect width="540" height="62" rx="14" fill="#0d1430" stroke="#4cc9f0" stroke-width="3"/>
    <text x="270" y="40" fill="#9aa6d6" font-size="26" font-weight="700" text-anchor="middle">뜻을 한글로 입력 ⌨️  →  펑! 💥</text>
  </g>

  <!-- 배지 -->
  <text x="600" y="60" fill="#4cc9f0" font-size="24" font-weight="800" letter-spacing="4" text-anchor="middle">⌨️ 10단계 · 모바일/PC · 영어공부</text>
</svg>
